<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Marcos - Catálogo de Servicios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <!-- Ahora el logo apunta correctamente al Inicio (index.html) -->
            <a class="navbar-brand text-warning fw-bold" href="index.html">
                <i class="bi bi-shield-plus"></i> Vet San Marcos
            </a>
            
            <div class="d-flex align-items-center gap-3">
                <!-- Botón para volver al Inicio -->
                <a href="index.html" class="btn btn-outline-light btn-sm">
                    <i class="bi bi-house"></i> Inicio
                </a>
                
                <!-- Botón del Carrito de Citas -->
                <button class="btn btn-outline-warning position-relative btn-sm" data-bs-toggle="modal" data-bs-target="#modalCarrito">
                    <i class="bi bi-calendar-check"></i> Citas
                    <span id="contador-carrito" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="container my-5">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-warning">Nuestros Servicios Médicos</h1>
            <p class="lead text-light">Selecciona el servicio que requiere tu mascota y agenda una hora.</p>
        </div>

        <div class="row" id="contenedor-productos">
            <!-- Renderizado dinámico desde servicios.js -->
        </div>
    </main>

    <!-- Modal del Carrito / Citas -->
    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-warning"><i class="bi bi-calendar-check"></i> Mis Citas Solicitadas</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-dark table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Servicio</th>
                                <th>Precio</th>
                                <th>Cant.</th>
                                <th>Subtotal</th>
                                <th>Acción</th>
                            </tr>
                        </thead>
                        <tbody id="lista-carrito"></tbody>
                    </table>
                    <div class="text-end fw-bold fs-5">
                        Total: $<span id="total-carrito">0</span>
                    </div>
                </div>
                <div class="modal-footer border-secondary">
                    <button onclick="vaciarCarrito()" class="btn btn-outline-danger btn-sm">Vaciar Lista</button>
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- JS de Bootstrap y Scripts Locales -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/servicios.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
