<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Marcos - Iniciar Sesión</title>
    <!-- BOOTSTRAP, MATERIALIZE & ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-4">
        <header class="mb-4">
            <h1><i class="material-icons">pets</i> <span id="logo-tienda"> Veterinaria San Marcos </span></h1>
            <strong> La mejor veteriaria para el mejor amigo del hombre </strong>
        </header>

        <section class="row justify-content-center">
            <div class="col-md-6">
                <div class="card p-4 shadow-sm">
                    <h3><i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión</h3>
                    <form id="formLogin" novalidate>
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-envelope"></i> Correo Electrónico</label>
                            <input type="email" class="form-control" id="loginEmail" placeholder="Ingrese su correo plis">
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-lock"></i> Contraseña</label>
                            <input type="password" class="form-control" id="loginPass">
                        </div>

                        <div id="resultado-validacion"></div>

                        <div class="d-flex gap-2 mt-3">
                            <button type="button" class="btn btn-success" onclick="validarLogin()">
                                <i class="bi bi-person-check"></i> Ingresar
                            </button>
                            <a href="registro.html" class="btn btn-outline-secondary">
                                <i class="bi bi-person-plus"></i> Registrarse
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/funciones.js"></script>
</body>
</html>
