<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Marcos - Registro de Usuario</title>

    <!-- BOOTSTRAP CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- MATERIALIZE CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    
    <!-- MATERIALIZE ICONS -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- BOOTSTRAP ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- CSS EXTERNO -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container mt-4">

        <!-- ===== ENCABEZADO ===== -->
        <header class="mb-4">
            <h1>
                <i class="material-icons">pets</i>
                <span id="logo-tienda">Veterinaria San Marcos</span>
            </h1>
            <p>Creación de cuenta para Dueños de Mascotas y Personal</p>
        </header>

        <!-- ===== FORMULARIO DE REGISTRO ===== -->
        <section class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 shadow-sm">
                    <h3><i class="bi bi-person-plus-fill"></i> Registro de Usuario</h3>
                    <p class="text-muted">Completa los datos para crear tu cuenta en el sistema.</p>

                    <form id="formularioRegistro" novalidate>

                        <!-- Nombre Completo -->
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-person"></i> Nombre Completo</label>
                            <input type="text" class="form-control" id="regNombre" placeholder="Ej: Juan Pérez">
                        </div>

                        <!-- RUT del Usuario -->
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-card-heading"></i> RUT (sin puntos y con guión)</label>
                            <input type="text" class="form-control" id="regRut" placeholder="12345678-9">
                        </div>

                        <!-- Correo Electrónico -->
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-envelope"></i> Correo Electrónico</label>
                            <input type="email" class="form-control" id="regEmail" placeholder="correo@ejemplo.com">
                        </div>

                        <!-- Rol de Usuario -->
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-person-badge"></i> Tipo de Usuario</label>
                            <select class="form-select" id="regRol">
                                <option value="">Selecciona un tipo de usuario</option>
                                <option value="DUENO">Dueño de Mascota</option>
                                <option value="RECEPCIONISTA">Recepcionista / Operador</option>
                                <option value="VETERINARIO">Médico Veterinario</option>
                            </select>
                        </div>

                        <!-- Contraseña -->
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-lock"></i> Contraseña</label>
                            <input type="password" class="form-control" id="regPass" placeholder="Mínimo 8 caracteres, números y letras">
                        </div>

                        <!-- Confirmar Contraseña -->
                        <div class="mb-3">
                            <label class="form-label"><i class="bi bi-shield-lock"></i> Confirmar Contraseña</label>
                            <input type="password" class="form-control" id="regPassConfirm">
                        </div>

                        <!-- CONTENEDOR DE RESULTADO DE VALIDACIÓN -->
                        <div id="resultado-validacion-registro"></div>

                        <!-- BOTONES DE ACCIÓN -->
                        <div class="d-flex gap-3 mt-4">
                            <!-- Botón Enviar Registro -->
                            <button type="button" class="btn-enviar" onclick="validarRegistro()">
                                <i class="bi bi-check-lg"></i> Registrarse
                            </button>
                            
                            <!-- Botón Limpiar -->
                            <button type="button" class="btn-limpiar" onclick="resetearRegistro()">
                                <i class="bi bi-eraser"></i> Limpiar
                            </button>
                        </div>

                        <div class="mt-3 text-center">
                            <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
                        </div>

                    </form>
                </div>
            </div>
        </section>

        <!-- ===== PIE DE PÁGINA ===== -->
        <footer class="mt-5 text-center text-muted">
            <i class="material-icons">copyright</i>
            © 2026 - Veterinaria San Marcos - Todos los derechos reservados
        </footer>

    </div>

    <!-- SCRIPTS -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    
    <!-- LÓGICA EN JS EXTERNO -->
    <script src="js/funciones.js"></script>
</body>
</html>
